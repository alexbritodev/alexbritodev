name: Update contribution trail

on:
  schedule:
    - cron: "29 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-trail
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'alexbritodev/alexbritodev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the public contribution calendar
        run: python3 scripts/render_contribution_trail.py
      - name: Commit changes to the image
        run: |
          git add assets/contribution-trail.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: refresh the contribution trail'
          git push origin HEAD:main

