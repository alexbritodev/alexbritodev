<svg xmlns="http://www.w3.org/2000/svg" width="200" height="38" viewBox="0 0 200 38" role="img" aria-labelledby="title">
  <title id="title">Explore my work</title>
  <style>
    .card { fill: #f8f6ff; stroke: #d7ccf6; }
    .terminal { fill: #5834a4; }
    .prompt { stroke: #fff; }
    .cursor { fill: #fff; }
    .label { fill: #2e204b; }
    .arrow { stroke: #5834a4; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #211932; stroke: #5b497b; }
      .terminal { fill: #b79af4; }
      .prompt { stroke: #25193c; }
      .cursor { fill: #25193c; }
      .label { fill: #f0eaff; }
      .arrow { stroke: #d4c1fc; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .cursor { animation: blink .9s ease-in-out 2; }
      .arrow { animation: nudge 1.8s ease-in-out 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .25; }
    }
    @keyframes nudge {
      0%, 35%, 100% { transform: translateX(0); }
      60% { transform: translateX(3px); }
    }
  </style>
  <rect class="card" x=".5" y=".5" width="199" height="37" rx="10"/>
  <rect class="terminal" x="8" y="7" width="30" height="24" rx="5"/>
  <path class="prompt" d="m15 15 4 4-4 4" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="22" y="22" width="8" height="1.5" rx=".75"/>
  <text class="label" x="47" y="23.5" font-family="system-ui, Segoe UI, sans-serif" font-size="12.5" font-weight="650">Explore my work</text>
  <path class="arrow" d="M173 19h11m-4-4 4 4-4 4" fill="none" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
